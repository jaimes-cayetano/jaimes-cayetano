<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Jhon Jaimes Cayetano — Software Engineer | Full Stack Developer | AI Solutions Developer">
<title>Jhon Jaimes Cayetano — Software Engineer | Full Stack Developer | AI Solutions Developer</title>
<defs>
<style>@font-face{font-family:M;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:M,'Montserrat','Segoe UI',Helvetica,Arial,sans-serif}
.shine{animation:s 6s ease-in-out infinite}
@keyframes s{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.shine{animation:none}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5edfb"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#620096"/><stop offset="1" stop-color="#9b4fd1"/></linearGradient>
<linearGradient id="logoFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#620096"/><stop offset="1" stop-color="#9b4fd1"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#b57fe6" stop-opacity="0.22"/><stop offset="1" stop-color="#b57fe6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#620096" fill-opacity="0.12"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="dotMask"><rect x="820" y="0" width="460" height="360" fill="url(#fade)"/></mask>
<clipPath id="card"><rect x="1" y="1" width="1278" height="358" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="360" fill="url(#bg)"/>
<circle cx="120" cy="320" r="260" fill="url(#glow)"/>
<circle cx="1180" cy="40" r="260" fill="url(#glow)"/>
<rect x="820" y="0" width="460" height="360" fill="url(#dots)" mask="url(#dotMask)"/>
<rect class="shine" x="0" y="352" width="1280" height="8" fill="url(#brand)"/>
</g>
<rect x="1" y="1" width="1278" height="358" rx="28" fill="none" stroke="#e7d8f2" stroke-width="2"/>


<text x="640" y="132" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="5" fill="#620096">HOLA, SOY</text>
<text x="640" y="200" text-anchor="middle" font-size="58" font-weight="700" fill="#111111">Jhon Jaimes Cayetano</text>
<text x="640" y="246" text-anchor="middle" font-size="23" font-weight="700" fill="url(#brand)">Software Engineer <tspan fill="#666666" font-weight="500">|</tspan> Full Stack Developer <tspan fill="#666666" font-weight="500">|</tspan> AI Solutions Developer</text>
<text x="1216" y="318" font-size="16" font-weight="700" text-anchor="end" fill="#620096">jhonjaimes.me</text>
</svg>
